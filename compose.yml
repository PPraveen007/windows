services:
  windows_2025:
    # image: my-server-unrestricted:latest
    image: dockurr/windows
    container_name: windows_2025
    privileged: true
    environment:
      VERSION: "2025"
      DHCP: "Y"
      DEBUG: "Y"
    devices:
      - /dev/kvm
      - /dev/net/tun
      - /dev/vhost-net
    device_cgroup_rules:
      - 'c *:* rwm'
    cap_add:
      - NET_ADMIN
    volumes:
      - ./win2025-eval.iso:/boot.iso
      - ./windows_2025_storage_task1:/storage
      - ./shared_win2025:/data
    restart: always
    stop_grace_period: 2m
    networks:
      ad_vlan:
        ipv4_address: ${AD_VLAN_IP}

  windows_11:
    # image: my-client-unrestricted:latest
    image: dockurr/windows
    container_name: windows_11
    privileged: true
    environment:
      VERSION: "11"
      DHCP: "Y"
      DEBUG: "Y"
    devices:
      - /dev/kvm
      - /dev/net/tun
      - /dev/vhost-net
    device_cgroup_rules:
      - 'c *:* rwm'
    cap_add:
      - NET_ADMIN
    volumes:
      - ./win11x64.iso:/boot.iso
      - ./windows_11_storage_task1:/storage
      - ./shared_win11:/data
    restart: always
    stop_grace_period: 2m
    networks:
      ad_vlan:
        ipv4_address: ${WS_VLAN_IP}
    depends_on:
      - windows_2025

networks:
  ad_vlan:
    external: true

